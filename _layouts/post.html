---
layout: default
---
<article class="page">
  <div class="container post">
    <header class="page-header">
      <div>
        <p class="mono accent">$ cat {{ page.slug }}.md</p>
        <h1>{{ page.title }}</h1>
      </div>
      {% include gcs.html %}
    </header>
    <div class="post-meta">
      {{ page.date | date: "%Y-%m-%d" }}
      {% if page.tags.size > 0 %} · {% for t in page.tags %}<span class="tag">{{ t }}</span> {% endfor %}{% endif %}
    </div>
    <div class="post-content">
      {{ content }}
    </div>
    <a class="back" href="{{ '/blog/' | relative_url }}">&larr; cd ../blog</a>
  </div>
</article>
