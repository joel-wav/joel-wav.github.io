<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <script>
    // Dark by default; apply a saved choice before first paint to avoid a flash.
    try { if (localStorage.getItem("theme") === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%2307090d'/><text x='50' y='66' font-family='monospace' font-size='52' font-weight='700' fill='%233dff9a' text-anchor='middle'>&gt;_</text></svg>">
</head>
<body>
  <nav class="nav">
    <div class="container">
      <a class="brand" href="{{ '/' | relative_url }}">~/<span class="accent">joel</span></a>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">menu</button>
      <ul>
        <li><a href="{{ '/' | relative_url }}#interests"><span class="idx">01.</span>interests</a></li>
        <li><a href="{{ '/' | relative_url }}#experience"><span class="idx">02.</span>experience</a></li>
        <li><a href="{{ '/' | relative_url }}#projects"><span class="idx">03.</span>projects</a></li>
        <li><a href="{{ '/' | relative_url }}#stack"><span class="idx">04.</span>stack</a></li>
        <li><a href="{{ '/' | relative_url }}#beyond"><span class="idx">05.</span>beyond</a></li>
        <li hidden><button class="theme-toggle drone-toggle" id="drone-toggle" type="button" aria-pressed="true" aria-label="Turn the background drone off">[drone: on]</button></li>
        <li><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch colour theme">[☀ light]</button></li>
        <li><a class="blog-link" href="{{ '/blog/' | relative_url }}">blog/</a></li>
      </ul>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="container">
      <span>&copy; {{ site.time | date: "%Y" }} Joel Varghese Jacob · built with &lt;3 and Jekyll</span>
      <span>
        <a href="{{ '/blog/' | relative_url }}">blog</a>
        <a href="https://github.com/joel-wav" target="_blank" rel="noopener">github</a>
        <a href="https://www.linkedin.com/in/joel-jac/" target="_blank" rel="noopener">linkedin</a>
        <a href="mailto:joelvarjacob@gmail.com">email</a>
      </span>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/drone.js' | relative_url }}" defer></script>
</body>
</html>
